services:

  db:
    image: postgres:16
    container_name: assignment11_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: intelligence_graph
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intelligence_graph"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: assignment11_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/intelligence_graph
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: assignment11_frontend
    restart: unless-stopped
    environment:
      # Used by Next.js server-side requests inside Docker
      API_BASE_URL: http://backend:8000

      # Used by browser-side requests from localhost
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8002
    ports:
      - "3002:3000"
    depends_on:
      - backend

volumes:
  postgres_data: